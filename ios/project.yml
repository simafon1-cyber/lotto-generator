# Описание проекта Xcode для iPhone. Готовый проект (LottoGenerator.xcodeproj)
# собирает из него программа XcodeGen — это делает сборка на GitHub
# (скрипт make_project.sh), вручную ничего создавать не нужно.
name: LottoGenerator
options:
  bundleIdPrefix: com.simafon
  deploymentTarget:
    iOS: "16.0"
targets:
  LottoGenerator:
    type: application
    platform: iOS
    sources:
      - ContentView.swift
      - LottoGeneratorApp.swift
      - Assets.xcassets
      # Вся программа — синей папкой web внутри приложения (работает без сети).
      - path: web
        type: folder
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Lotto Generator
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Только обычный HTTPS — Apple не спрашивает про шифрование при отправке.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        LSApplicationCategoryType: public.app-category.utilities
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simafon.LottoGenerator
        MARKETING_VERSION: "1.0"
        # Номер сборки растёт с каждой сборкой на GitHub: TestFlight
        # принимает каждый номер только один раз.
        CURRENT_PROJECT_VERSION: "${BUILD_NUMBER}"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: NO
    scheme: {}
